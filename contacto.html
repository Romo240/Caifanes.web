<h1>Contacto</h1>
<link rel="stylesheet" href="style.css">
<p>
    ¿También eres fan de Caifanes? Cuéntanos un poco sobre tus canciones
    y álbumes favoritos.
</p>

<form>

    <label>Nombre:</label><br>
    <input type="text" name="nombre"><br><br>

    <label>Correo electrónico:</label><br>
    <input type="email" name="correo"><br><br>

    <label>Canción favorita de Caifanes:</label><br>
    <input type="text" name="cancion"><br><br>

    <label>Álbum favorito:</label><br>
    <select name="album">
        <option>Caifanes</option>
        <option>Caifanes Vol. II</option>
        <option>El Silencio</option>
        <option>El Nervio del Volcán</option>
    </select><br><br>

    <label>¿Que te pareció Caifanes?</label><br>
    <textarea name="mensaje" rows="5" cols="40"></textarea><br><br>

    <input type="submit" value="Enviar">

</form>
